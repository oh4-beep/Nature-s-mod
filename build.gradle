plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.name
}

repositories {
	// Loom adds the repositories needed for Minecraft and Fabric automatically.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"naturesmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Headless dedicated server that generates terrain around spawn, prints a
		// terrain report (heights, biomes, feature counts, ASCII relief maps) and exits.
		// Used by CI to validate the worldgen data pack and features: ./gradlew runSmokeTest
		smokeTest {
			server()
			name "Worldgen Smoke Test"
			vmArg "-Dnaturesmod.smoketest=true"
			programArg "nogui"
			runDir "run/smoketest"
			ideConfigGenerated false
		}
	}
}

fabricApi {
	// A client game test walks through the new content in a real client and takes screenshots:
	// ./gradlew runClientGameTest (see src/gametest).
	configureTests {
		createSourceSet = true
		modId = "naturesmod-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = false
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
