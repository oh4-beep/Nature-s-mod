# Builds the mod on every push / pull request, then boots a headless dedicated
# server that generates terrain with the mod installed and prints a terrain report.
name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: prepare server directory
        run: |
          mkdir -p run/smoketest
          echo "eula=true" > run/smoketest/eula.txt
          cat > run/smoketest/server.properties <<'EOF'
          level-seed=8675309
          online-mode=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          sync-chunk-writes=false
          max-tick-time=-1
          pause-when-empty-seconds=0
          EOF
      - name: run worldgen smoke test
        run: ./gradlew runSmokeTest
      - name: print cpu profile
        # The test records a CPU profile of itself, to find what the mod costs (see .github/profile).
        if: always()
        run: python3 .github/profile/hotspots.py run/smoketest/profile.jfr || true
      - name: print terrain report
        if: always()
        run: cat run/smoketest/naturesmod-report.txt || true
      - name: check the smoke test passed
        # The server exits normally even when it refuses to load the world, so judge by the report.
        run: |
          grep -q "RESULT: PASSED" run/smoketest/naturesmod-report.txt
      - name: check for data errors
        # Broken recipes, loot tables or advancements are only logged, so look for them.
        if: always()
        run: |
          if grep -E "/ERROR\].*naturesmod" run/smoketest/logs/latest.log; then exit 1; fi

  # Plays through the sea and the Nether in a real (software-rendered) client and takes screenshots.
  client-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri imagemagick
      - name: prepare client directory
        run: |
          mkdir -p build/run/clientGameTest
          echo "eula=true" > build/run/clientGameTest/eula.txt
          printf 'version:4896\npreferredGraphicsBackend:"opengl"\nrenderDistance:6\nsimulationDistance:6\nmaxFps:30\n' > build/run/clientGameTest/options.txt
      - name: run client game test
        run: mkdir -p /tmp/jfr && chmod +x ./gradlew && xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace
        env:
          JAVA_TOOL_OPTIONS: -XX:StartFlightRecording=filename=/tmp/jfr/client-%p.jfr,settings=profile,dumponexit=true
      - name: print screenshots
        if: always()
        # Shrunk to small JPEGs so the whole set fits in the log. The ones named like FOCUS (what is being worked on)
        # come last, where a look at the tail of the log finds them.
        env:
          FOCUS: disaster_
        run: |
          shots=$(ls build/run/clientGameTest/screenshots/*.png 2>/dev/null || true)
          for f in $(echo "$shots" | grep -v -- "$FOCUS"; echo "$shots" | grep -- "$FOCUS"); do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png).jpg
            size=854x480
            case "$n" in *treasure*) size=640x360 ;; esac
            convert "$f" -resize $size -quality 82 "/tmp/$n"
            echo "[map-begin $n]"
            base64 -w 3000 "/tmp/$n" | sed 's/^/[map] /'
            echo "[map-end $n]"
          done
      # After the screenshots: a long recording takes a while to read.
      - name: print cpu profile
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: python3 .github/profile/hotspots.py /tmp/jfr/*.jfr || true
      # Last, where the tail of the log shows it: what went wrong in the game, if anything.
      - name: print the game test's problems
        if: always()
        run: |
          log=build/run/clientGameTest/logs/latest.log
          [ -f "$log" ] || exit 0
          grep -n -E "ERROR|FAIL|Exception|Caused by|at com\.naturesmod|at net\.minecraft" "$log" | grep -v "Detected unsafe terrain read" | tail -200 || true
          echo "----- the end of the game's log"
          tail -60 "$log"
          echo "----- what the scenes said"
          grep -E "\[gametest\]|moved wrongly|moved too quickly|floating too long" "$log" | tail -150 || true
