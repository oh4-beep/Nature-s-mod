# Builds the mod on every push / pull request, then boots a headless dedicated
# server that generates terrain with the mod installed and prints a terrain report.
name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: prepare server directory
        run: |
          mkdir -p run/smoketest
          echo "eula=true" > run/smoketest/eula.txt
          cat > run/smoketest/server.properties <<'EOF'
          level-seed=8675309
          online-mode=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          sync-chunk-writes=false
          max-tick-time=-1
          EOF
      - name: run worldgen smoke test
        run: ./gradlew runSmokeTest
      - name: print terrain report
        if: always()
        run: cat run/smoketest/naturesmod-report.txt || true
      - name: check the smoke test passed
        # The server exits normally even when it refuses to load the world, so judge by the report.
        run: grep -q "RESULT: PASSED" run/smoketest/naturesmod-report.txt

  # Temporary development aid: prints the vanilla sources the new content builds on.
  source-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: decompile minecraft
        run: chmod +x ./gradlew && ./gradlew genSources --stacktrace
      - name: print sources
        run: bash .github/probe/sources.sh
