# Builds the mod on every push / pull request, then boots a headless dedicated
# server that generates terrain with the mod installed and prints a terrain report.
name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: prepare server directory
        run: |
          mkdir -p run/smoketest
          echo "eula=true" > run/smoketest/eula.txt
          cat > run/smoketest/server.properties <<'EOF'
          level-seed=8675309
          online-mode=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          sync-chunk-writes=false
          max-tick-time=-1
          EOF
      - name: run worldgen smoke test
        run: ./gradlew runSmokeTest
      - name: print terrain report
        if: always()
        run: cat run/smoketest/naturesmod-report.txt || true
      - name: check the smoke test passed
        # The server exits normally even when it refuses to load the world, so judge by the report.
        run: |
          grep -q "RESULT: PASSED" run/smoketest/naturesmod-report.txt
      - name: check for data errors
        # Broken recipes, loot tables or advancements are only logged, so look for them.
        if: always()
        run: |
          if grep -E "/ERROR\].*naturesmod" run/smoketest/logs/latest.log; then exit 1; fi

  # Plays through the sea and the Nether in a real (software-rendered) client and takes screenshots.
  client-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri imagemagick
      - name: prepare client directory
        run: |
          mkdir -p build/run/clientGameTest
          echo "eula=true" > build/run/clientGameTest/eula.txt
          printf 'version:4896\npreferredGraphicsBackend:"opengl"\nrenderDistance:6\nsimulationDistance:6\nmaxFps:30\n' > build/run/clientGameTest/options.txt
      - name: run client game test
        run: chmod +x ./gradlew && xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace
      - name: print screenshots
        if: always()
        # Shrunk to small JPEGs so the whole set fits in the log.
        run: |
          for f in build/run/clientGameTest/screenshots/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png).jpg
            convert "$f" -resize 854x480 -quality 85 "/tmp/$n"
            echo "[map-begin $n]"
            base64 -w 3000 "/tmp/$n" | sed 's/^/[map] /'
            echo "[map-end $n]"
          done
